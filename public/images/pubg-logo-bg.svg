<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" fill="none">
  <defs>
    <linearGradient id="pubgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#centerGlow)" />

  <!-- Perisai & Emblem Battle Royale PUBG di Latar Belakang -->
  <g transform="translate(600, 250)" stroke="url(#pubgGold)" stroke-width="5" fill="none">
    <polygon points="0,-210 190,-120 150,130 0,210 -150,130 -190,-120" fill="#111827" fill-opacity="0.65" />
    <polygon points="0,-180 160,-100 125,110 0,180 -125,110 -160,-100" stroke-width="2" stroke-opacity="0.5" />

    <!-- Siluet Helm Level 3 Ikonik PUBG -->
    <path d="M-85,-35 C-85,-105 85,-105 85,-35 L95,55 C95,90 55,115 0,115 C-55,115 -95,90 -95,55 Z" fill="#1E293B" fill-opacity="0.85" stroke="url(#pubgGold)" stroke-width="4" />
    <!-- Visor Helm -->
    <rect x="-70" y="-20" width="140" height="42" rx="8" fill="#090D16" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.7" />
    <line x1="-55" y1="-5" x2="55" y2="-5" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.45" />
    <line x1="-55" y1="8" x2="55" y2="8" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.45" />
    <!-- Grill Mulut Helm -->
    <path d="M-45,42 L45,42 L35,88 L-35,88 Z" fill="#090D16" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.6" />
  </g>

  <!-- Watermark Tipografi PUBG di Belakang -->
  <text x="600" y="295" text-anchor="middle" fill="#F59E0B" fill-opacity="0.07" font-family="sans-serif" font-size="190" font-weight="900" letter-spacing="18">
    PUBG
  </text>
</svg>